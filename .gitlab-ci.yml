variables:
  REGION: asia-southeast1
  IMAGE_NAME: ktn-referral
  CONTAINER_REPO_ASIA_STAG: 968557029040.dkr.ecr.ap-southeast-1.amazonaws.com/stag/ktn-referral
  CONTAINER_REPO_ASIA_PROD: harbor.atomsolution.vn/ktn/ktn-referral
  NAMESPACE: ktn-website-stag
  FULLREPO_ASIA: $CONTAINER_REPO_ASIA:$CI_COMMIT_SHORT_SHA
  FULLREPO_ASIA_PROD: $CONTAINER_REPO_ASIA_PROD:$CI_COMMIT_SHORT_SHA
  HELM_VALUE: ${CI_COMMIT_REF_NAME}
  HELM_VERSION: 3.0.0
  AWS_REGION: ap-southeast-1
  GITLAB_TOKEN: $GITLAB_RUNNER_TOKEN
  DOCKER_DRIVER: overlay
  #DOCKER_HOST: tcp://localhost:2375
  DOCKER_TLS_CERTDIR: ""
  GIT_SUBMODULE_STRATEGY: recursive
  PROD_SERVER_1_IP: 3.66.46.121
  PROD_SERVER_USER: root

stages:
  - build
  - deploy

.kubectl_config: &kubectl_config
  - env
  - |
      if [ "$CI_COMMIT_REF_NAME" == "stag" ]; then
        aws eks --region $AWS_REGION update-kubeconfig --name esol-staging-cluster
      fi
  - |
      if [ "$CI_COMMIT_REF_NAME" == "master" ]; then
        aws eks --region $AWS_REGION update-kubeconfig --name esol-production-cluster
      fi
.predeploy: &predeploy |
  apk add --no-cache  bash git  python3 py3-pip curl
  pip3 install --upgrade pip 
  pip3 install --no-cache-dir awscli==1.19.112 
  helm plugin install https://github.com/hypnoglow/helm-s3.git
  helm repo add helm-template s3://esol-helm-template
  helm pull s3://esol-helm-template/helm-template-$HELM_VERSION.tgz --untar=true

build_stag:
  image: docker:19.03.1
  tags:
  - esol-stag-test
  stage: build
  services:
  - docker:19.03.1-dind
  before_script:
    - apk add --no-cache curl jq python py-pip wget git bash
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - pip install awscli==1.19.112  
    - export VERIFY_CHECKSUM=false && curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 && chmod +x ./get_helm.sh && ./get_helm.sh
    - curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/v1.38.0/skaffold-linux-amd64 && chmod +x skaffold &&  mv skaffold /usr/local/bin
  script:
    #- aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $CONTAINER_REPO_ASIA
    - docker login -u AWS -p $(aws ecr get-login-password --region $AWS_REGION) $CONTAINER_REPO_ASIA_STAG
    - |
      if [ "$CI_COMMIT_REF_NAME" == "stag" ]; then
        sed -i -e "s#\[NAMESPACE\]#$NAMESPACE#g" skaffold.yaml
        sed -i -e "s#\[IMAGE_NAME\]#$IMAGE_NAME#g" skaffold.yaml
        sed -i -e "s#\[CONTAINER_REPO\]#$CONTAINER_REPO_ASIA_STAG#g" skaffold.yaml
      fi
    - cat skaffold.yaml  
    - /usr/local/bin/skaffold build -p profile-stag --file-output=build.json
  only:
    refs:
      - stag
  artifacts:
    paths:
    - skaffold.yaml
    - build.json

build:
  stage: build
  image: docker:19.03.1
  services:
    - docker:19.03.1-dind
  tags:
    - esol-stag-test
  before_script:
    - apk add --no-cache curl jq python py-pip wget git bash
    - git submodule sync --recursive
    - git submodule update --init --remote --recursive
    - git submodule add -f --branch stag https://read-token:$GITLAB_TOKEN@gitlab.rinznetwork.com/katana/ktn-lib.git lib
  script:
  #  - cp $PROD_ENV .env
    - docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - docker build -t $FULLREPO_ASIA_PROD . -f Dockerfile-prod
    - docker image push $FULLREPO_ASIA_PROD

  only:
    - master


deploy:
  stage: deploy
  image:  alpine/helm:3.2.1
  tags:
  - esol-stag
  script:
    - *predeploy
    - *kubectl_config
    - git clone https://read-token:$GITLAB_TOKEN@gitlab.rinznetwork.com/rinz-io-devops/helm-value/katana/$IMAGE_NAME.git
    - mv $IMAGE_NAME/stag.yaml .
    - |
      if [ "$CI_COMMIT_REF_NAME" == "stag" ]; then
        sed -i -e "s#\[FULLREPO_ASIA\]#$FULLREPO_ASIA#g" stag.yaml
        sed -i -e "s#\[NAMESPACE\]#$NAMESPACE#g" stag.yaml
      fi
    - curl -LO https://storage.googleapis.com/kubernetes-release/release/v1.18.0/bin/linux/amd64/kubectl && chmod +x ./kubectl && mv ./kubectl /usr/local/bin/kubectl
    - curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/v1.38.0/skaffold-linux-amd64 && chmod +x skaffold &&  mv skaffold /usr/local/bin

    - /usr/local/bin/skaffold deploy -p profile-stag   -a build.json
  only:
    refs:
      - stag


deploy-prod-server1:
  stage: deploy
  image: docker:19.03.1
  services:
    - docker:19.03.1-dind
  tags:
    - esol-stag
  before_script:
    - apk add openssh
    - mkdir -p ~/.ssh
    - echo "$SSH_PROD_SERVER_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 400 ~/.ssh/id_rsa
    - eval "$(ssh-agent -s)"
    - ssh-add ~/.ssh/id_rsa
    - ssh-keyscan -H $PROD_SERVER_1_IP >> ~/.ssh/known_hosts
  script:
    - sed -i -e "s#\[IMAGE_REPO\]#$FULLREPO_ASIA_PROD#g" docker-compose.yaml 
    - scp docker-compose.yaml  root@${PROD_SERVER_1_IP}:/data/cicd/ktn-referral/docker-compose.yaml 
    - ssh root@$PROD_SERVER_1_IP "docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}"
    - ssh root@$PROD_SERVER_1_IP "cd /data/cicd/ktn-referral/ && docker-compose up --build -d"
  only:
    - master